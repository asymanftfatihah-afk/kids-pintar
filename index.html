<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Pembelajaran Kanak-Kanak</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background-color: #F7FFF7;
            margin: 0;
            padding: 20px;
            color: var(--dark);
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 4px solid var(--secondary);
        }

        .lang-select {
            margin-bottom: 20px;
            background: #eef2f5;
            padding: 10px;
            border-radius: 10px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin: 8px;
            transition: transform 0.1s;
            box-shadow: 0 4px 0 #d64545;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        button.btn-sec {
            background-color: var(--secondary);
            box-shadow: 0 4px 0 #3db3ac;
        }

        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .card {
            border: 3px solid #eee;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            font-size: 40px;
            background: #fff;
            transition: 0.2s;
        }

        .card:hover {
            border-color: var(--secondary);
            background: #eefdfc;
        }

        .hidden { display: none; }
        
        /* Game Styling */
        #game-area {
            height: 200px;
            background: #e8f8f5;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            border: 2px dashed var(--secondary);
        }
        
        .food {
            font-size: 50px;
            position: absolute;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Tetapan Bahasa oleh Ibu Bapa -->
    <div class="lang-select">
        <label><strong>Bahasa / Language: </strong></label>
        <select id="language" onchange="changeLanguage()">
            <option value="ms">Bahasa Melayu</option>
            <option value="en">English</option>
        </select>
    </div>

    <!-- Menu Utama -->
    <div id="main-menu">
        <h1 id="txt-title">Dunia Pembelajaran Si Cilik</h1>
        <button onclick="showQuizLevels()" id="btn-quiz-menu">Kuiz Matematik</button><br>
        <button class="btn-sec" onclick="startSoundGame()" id="btn-sound-menu">Mengenal Bunyi Haiwan</button><br>
        <button style="background-color: #9B59B6; box-shadow: 0 4px 0 #8e44ad;" onclick="startGame()" id="btn-play-menu">Permainan: Beri Dino Makan!</button>
    </div>

    <!-- Mod Pilihan Tahap Kuiz -->
    <div id="quiz-levels" class="hidden">
        <h2 id="txt-select-level">Pilih Tahap Soalan</h2>
        <button onclick="startQuiz(5)">5 Soalan</button>
        <button onclick="startQuiz(10)">10 Soalan</button>
        <button onclick="startQuiz(15)">15 Soalan</button><br><br>
        <button class="btn-sec" onclick="showMainMenu()" id="btn-back-1">Kembali</button>
    </div>

    <!-- Mod Kuiz Matematik -->
    <div id="quiz-box" class="hidden">
        <h3 id="quiz-progress"></h3>
        <h1 id="quiz-question" style="font-size: 48px;"></h1>
        <div id="quiz-answers" class="grid-options"></div>
    </div>

    <!-- Mod Bunyi Haiwan -->
    <div id="sound-box" class="hidden">
        <h2 id="txt-sound-title">Dengar & Pilih Haiwan!</h2>
        <button style="font-size: 30px;" onclick="playAnimalSound()">🔊 <span id="txt-play-sound">Main Bunyi</span></button>
        <div id="sound-options" class="grid-options" style="margin-top: 20px;"></div>
    </div>

    <!-- Mod Permainan Kanak-Kanak (Umur 3 Tahun) -->
    <div id="game-box" class="hidden">
        <h2 id="txt-game-title">Tekan Epal Untuk Beri Dino Makan! 🦖</h2>
        <div id="game-area"></div>
        <p><span id="txt-score">Makanan dimakan</span>: <strong id="game-score">0</strong></p>
        <button class="btn-sec" onclick="showMainMenu()" id="btn-back-2">Kembali</button>
    </div>

    <!-- Paparan Keputusan Kuiz / Bunyi -->
    <div id="result-box" class="hidden">
        <h2 id="txt-well-done">Tahniah! 🎉</h2>
        <p id="result-text" style="font-size: 24px;"></p>
        <button onclick="showMainMenu()" id="btn-back-3">Menu Utama</button>
    </div>
</div>

<script>
    // Data Bahasa
    const i18n = {
        ms: {
            title: "Dunia Pembelajaran Si Cilik",
            quizMenu: "Kuiz Matematik",
            soundMenu: "Mengenal Bunyi Haiwan",
            playMenu: "Permainan: Beri Dino Makan!",
            selectLevel: "Pilih Tahap Soalan",
            back: "Kembali",
            playSound: "Main Bunyi",
            soundTitle: "Dengar & Pilih Haiwan!",
            gameTitle: "Tekan Epal Untuk Beri Dino Makan! 🦖",
            score: "Makanan dimakan",
            wellDone: "Tahniah! 🎉",
            resultQuiz: "Anda telah menjawab semua soalan!",
            correct: "Betul!",
            wrong: "Cuba Lagi!"
        },
        en: {
            title: "Toddler Learning World",
            quizMenu: "Math Quiz",
            soundMenu: "Learn Animal Sounds",
            playMenu: "Game: Feed the Dino!",
            selectLevel: "Select Question Level",
            back: "Back",
            playSound: "Play Sound",
            soundTitle: "Listen & Pick the Animal!",
            gameTitle: "Tap Apples to Feed the Dino! 🦖",
            score: "Food eaten",
            wellDone: "Well Done! 🎉",
            resultQuiz: "You completed all questions!",
            correct: "Correct!",
            wrong: "Try Again!"
        }
    };

    let currentLang = 'ms';
    let currentQuestionIndex = 0;
    let quizQuestions = [];
    let score = 0;
    let targetSoundAnimal = null;

    // Database Haiwan & Bunyi Web Audio API (Tanpa perlukan fail audio luaran)
    const animals = [
        { name: 'Kucing / Cat', icon: '🐱', soundType: 'meow' },
        { name: 'Anjing / Dog', icon: '🐶', soundType: 'bark' },
        { name: 'Lembu / Cow', icon: '🐮', soundType: 'moo' },
        { name: 'Itik / Duck', icon: '🦆', soundType: 'quack' }
    ];

    function changeLanguage() {
        currentLang = document.getElementById('language').value;
        const text = i18n[currentLang];
        
        document.getElementById('txt-title').innerText = text.title;
        document.getElementById('btn-quiz-menu').innerText = text.quizMenu;
        document.getElementById('btn-sound-menu').innerText = text.soundMenu;
        document.getElementById('btn-play-menu').innerText = text.playMenu;
        document.getElementById('txt-select-level').innerText = text.selectLevel;
        document.getElementById('btn-back-1').innerText = text.back;
        document.getElementById('btn-back-2').innerText = text.back;
        document.getElementById('btn-back-3').innerText = text.back;
        document.getElementById('txt-play-sound').innerText = text.playSound;
        document.getElementById('txt-sound-title').innerText = text.soundTitle;
        document.getElementById('txt-game-title').innerText = text.gameTitle;
        document.getElementById('txt-score').innerText = text.score;
        document.getElementById('txt-well-done').innerText = text.wellDone;
    }

    function hideAll() {
        ['main-menu', 'quiz-levels', 'quiz-box', 'sound-box', 'game-box', 'result-box'].forEach(id => {
            document.getElementById(id).classList.add('hidden');
        });
    }

    function showMainMenu() {
        hideAll();
        document.getElementById('main-menu').classList.remove('hidden');
    }

    function showQuizLevels() {
        hideAll();
        document.getElementById('quiz-levels').classList.remove('hidden');
    }

    // Penjanaan Soalan Matematik Unik (Tanpa Berulang)
    function generateMathQuestions(count) {
        let set = new Set();
        let list = [];
        
        while(list.length < count) {
            let n1 = Math.floor(Math.random() * 5) + 1;
            let n2 = Math.floor(Math.random() * 5) + 1;
            let key = `${n1}+${n2}`;
            
            if(!set.has(key)) {
                set.add(key);
                let correct = n1 + n2;
                let options = [correct, correct + 1, Math.max(1, correct - 1), correct + 2];
                // Shuffle pilihan jawapan
                options = [...new Set(options)].sort(() => Math.random() - 0.5).slice(0, 4);
                
                list.push({
                    q: `${n1} + ${n2} = ?`,
                    ans: correct,
                    options: options
                });
            }
        }
        return list;
    }

    function startQuiz(totalQuestions) {
        quizQuestions = generateMathQuestions(totalQuestions);
        currentQuestionIndex = 0;
        hideAll();
        document.getElementById('quiz-box').classList.remove('hidden');
        renderQuestion();
    }

    function renderQuestion() {
        let qData = quizQuestions[currentQuestionIndex];
        document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / ${quizQuestions.length}`;
        document.getElementById('quiz-question').innerText = qData.q;
        
        let container = document.getElementById('quiz-answers');
        container.innerHTML = '';
        
        qData.options.forEach(opt => {
            let btn = document.createElement('div');
            btn.className = 'card';
            btn.innerText = opt;
            btn.onclick = () => {
                if(opt === qData.ans) {
                    alert(i18n[currentLang].correct);
                    currentQuestionIndex++;
                    if(currentQuestionIndex < quizQuestions.length) {
                        renderQuestion();
                    } else {
                        showResult(i18n[currentLang].resultQuiz);
                    }
                } else {
                    alert(i18n[currentLang].wrong);
                }
            };
            container.appendChild(btn);
        });
    }

    // Permainan Bunyi Haiwan
    function startSoundGame() {
        hideAll();
        document.getElementById('sound-box').classList.remove('hidden');
        
        // Pilih 1 haiwan rawak sebagai soalan
        targetSoundAnimal = animals[Math.floor(Math.random() * animals.length)];
        
        let container = document.getElementById('sound-options');
        container.innerHTML = '';
        
        animals.forEach(anim => {
            let card = document.createElement('div');
            card.className = 'card';
            card.innerText = anim.icon;
            card.onclick = () => {
                if(anim === targetSoundAnimal) {
                    alert(i18n[currentLang].correct);
                    startSoundGame(); // Soalan seterusnya
                } else {
                    alert(i18n[currentLang].wrong);
                }
            };
            container.appendChild(card);
        });
    }

    // Sintesis Bunyi Tiruan Menggunakan Web Audio API
    function playAnimalSound() {
        if(!targetSoundAnimal) return;
        
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        let type = targetSoundAnimal.soundType;
        if(type === 'meow') {
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.5);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } else if(type === 'bark') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.setValueAtTime(100, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        } else if(type === 'moo') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.8);
            osc.start();
            osc.stop(ctx.currentTime + 0.8);
        } else if(type === 'quack') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(150, ctx.currentTime + 0.3);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }
    }

    // Permainan Kanak-kanak 3 Tahun (Beri Dino Makan)
    let gameScore = 0;
    function startGame() {
        hideAll();
        document.getElementById('game-box').classList.remove('hidden');
        gameScore = 0;
        document.getElementById('game-score').innerText = gameScore;
        spawnFood();
    }

    function spawnFood() {
        let area = document.getElementById('game-area');
        area.innerHTML = '';
        
        let food = document.createElement('div');
        food.className = 'food';
        food.innerText = '🍎';
        
        // Kedudukan rawak yang mudah ditekan
        food.style.top = Math.random() * 120 + 'px';
        food.style.left = Math.random() * 80 + '%';
        
        food.onclick = () => {
            gameScore++;
            document.getElementById('game-score').innerText = gameScore;
            spawnFood();
        };
        
        area.appendChild(food);
    }

    function showResult(text) {
        hideAll();
        document.getElementById('result-box').classList.remove('hidden');
        document.getElementById('result-text').innerText = text;
    }
</script>
</body>
</html>
