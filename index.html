<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Belajar Kanak-Kanak</title>
  <style>
    :root {
      --bg-pink: #ffeef4;
      --card-border: #ffd1dc;
      --text-color: #ff3366;
      --primary-btn: #ff477e;
      --star-color: #ffca28;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #ffd6e7 0%, #fff0f5 50%, #e8f5e9 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Standard Mobile Frame */
    .app-container {
      width: 100%;
      max-width: 414px;
      height: 100vh;
      max-height: 896px;
      background: linear-gradient(180deg, #fff2f7 0%, #ffe3ed 100%);
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    .top-bar {
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      background: white;
      border: 2px solid var(--card-border);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-color);
      box-shadow: 0 3px 0 var(--card-border);
    }

    .star-badge {
      background: white;
      border: 2px solid #ffe082;
      border-radius: 20px;
      padding: 5px 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #f57f17;
      box-shadow: 0 3px 0 #ffe082;
    }

    /* Views */
    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      padding: 15px 20px;
      overflow-y: auto;
    }

    .view.active {
      display: flex;
    }

    /* Menu Grid */
    .menu-title {
      text-align: center;
      color: var(--text-color);
      font-size: 26px;
      margin: 10px 0 20px;
      text-shadow: 1px 1px 0px white;
    }

    .topics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .topic-card {
      background: white;
      border: 3px dashed var(--card-border);
      border-radius: 20px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 5px 0 var(--card-border);
    }

    .topic-card:active {
      transform: scale(0.95);
    }

    .topic-icon {
      font-size: 50px;
      margin-bottom: 8px;
    }

    .topic-label {
      background: #f8f9fa;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 14px;
      font-weight: bold;
      color: #444;
      text-align: center;
      width: 100%;
    }

    /* Game / Quiz View */
    .question-box {
      background: white;
      border: 3px dashed var(--card-border);
      border-radius: 24px;
      padding: 20px 15px;
      text-align: center;
      position: relative;
      margin-bottom: 20px;
      box-shadow: 0 4px 0 var(--card-border);
    }

    .question-text {
      color: var(--text-color);
      font-size: 22px;
      font-weight: bold;
    }

    .audio-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      background: #f0f0f0;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      cursor: pointer;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      flex: 1;
    }

    .option-card {
      background: white;
      border: 3px dashed var(--card-border);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 50px;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 5px 0 var(--card-border);
      min-height: 120px;
    }

    .option-card:active {
      transform: scale(0.95);
    }

    /* Sub-menu / Mode Selection View */
    .sub-menu-card {
      background: white;
      border: 3px dashed var(--card-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
    }

    .main-button {
      background: linear-gradient(180deg, #ff6b8b 0%, #ff3366 100%);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 #c41e4a;
      width: 80%;
      margin-top: 10px;
    }

    .main-button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #c41e4a;
    }

    /* Color Swatch Helper */
    .color-block {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      box-shadow: 0 3px 0 rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="icon-btn" onclick="showView('menu')">✕</div>
    <div class="star-badge">
      ⭐ <span id="star-count">0</span>
    </div>
  </div>

  <!-- MENU VIEW -->
  <div id="view-menu" class="view active">
    <h2 class="menu-title">Pilih Topik 🎈</h2>
    <div class="topics-grid">
      <div class="topic-card" onclick="openTopic('warna')">
        <div class="topic-icon">🎨</div>
        <div class="topic-label">Warna</div>
      </div>
      <div class="topic-card" onclick="openTopic('haiwan')">
        <div class="topic-icon">🐶</div>
        <div class="topic-label">Haiwan</div>
      </div>
      <div class="topic-card" onclick="openTopic('buah')">
        <div class="topic-icon">🍎</div>
        <div class="topic-label">Buah-buahan</div>
      </div>
      <div class="topic-card" onclick="openTopic('nombor')">
        <div class="topic-icon">🔢</div>
        <div class="topic-label">Nombor</div>
      </div>
      <div class="topic-card" onclick="openTopic('bentuk')">
        <div class="topic-icon">🔺</div>
        <div class="topic-label">Bentuk</div>
      </div>
      <div class="topic-card" onclick="openTopic('abc')">
        <div class="topic-icon">🔤</div>
        <div class="topic-label">Mengenal ABC</div>
      </div>
    </div>
  </div>

  <!-- SUB-MENU MODE VIEW -->
  <div id="view-submenu" class="view">
    <h2 id="submenu-title" class="menu-title">Topik</h2>
    
    <div class="sub-menu-card">
      <h3 style="color:#ff3366; margin-bottom: 8px;">📖 Belajar</h3>
      <p style="color:#666; font-size:14px; margin-bottom:12px;">Tekan gambar, dengar sebutan!</p>
      <button class="main-button" onclick="startMode('learn')">BELAJAR! 🚀</button>
    </div>

    <div class="sub-menu-card">
      <h3 style="color:#28a745; margin-bottom: 8px;">🎯 Kuiz</h3>
      <p style="color:#666; font-size:14px; margin-bottom:12px;">Uji apa yang kamu tahu!</p>
      <button class="main-button" style="background: linear-gradient(180deg, #2ed573 0%, #26af5f 100%); box-shadow: 0 4px 0 #1e8447;" onclick="startMode('quiz')">MAIN KUIZ! 🎮</button>
    </div>
  </div>

  <!-- QUIZ / GAME VIEW -->
  <div id="view-quiz" class="view">
    <div class="question-box">
      <div id="question-text" class="question-text">Pilih soalan</div>
      <div class="audio-btn" onclick="speakCurrentQuestion()">🔊</div>
    </div>
    <div id="options-container" class="options-grid">
      <!-- Dynamic Options -->
    </div>
  </div>
</div>

<script>
  // Database Kandungan Khas Kanak-kanak 2-3 Tahun
  const DATA = {
    warna: [
      { name: 'merah', type: 'color', value: '#ff3b30' },
      { name: 'biru', type: 'color', value: '#007aff' },
      { name: 'kuning', type: 'color', value: '#ffcc00' },
      { name: 'hijau', type: 'color', value: '#34c759' }
    ],
    haiwan: [
      { name: 'kucing', type: 'emoji', value: '🐱' },
      { name: 'anjing', type: 'emoji', value: '🐶' },
      { name: 'lembu', type: 'emoji', value: '🐮' },
      { name: 'itik', type: 'emoji', value: '🦆' }
    ],
    buah: [
      { name: 'epal', type: 'emoji', value: '🍎' },
      { name: 'pisang', type: 'emoji', value: '🍌' },
      { name: 'anggur', type: 'emoji', value: '🍇' },
      { name: 'oren', type: 'emoji', value: '🍊' }
    ],
    nombor: [
      { name: 'satu', type: 'text', value: '1' },
      { name: 'dua', type: 'text', value: '2' },
      { name: 'tiga', type: 'text', value: '3' },
      { name: 'empat', type: 'text', value: '4' }
    ],
    bentuk: [
      { name: 'bulat', type: 'emoji', value: '⚪' },
      { name: 'segi tiga', type: 'emoji', value: '🔺' },
      { name: 'segi empat', type: 'emoji', value: '⬛' },
      { name: 'bintang', type: 'emoji', value: '⭐' }
    ],
    abc: [
      { name: 'A', type: 'text', value: 'A' },
      { name: 'B', type: 'text', value: 'B' },
      { name: 'C', type: 'text', value: 'C' },
      { name: 'D', type: 'text', value: 'D' }
    ]
  };

  let currentTopic = '';
  let currentMode = '';
  let currentQuestionIndex = 0;
  let currentCorrectItem = null;
  let stars = 0;

  function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + viewId).classList.add('active');
  }

  function openTopic(topicKey) {
    currentTopic = topicKey;
    const topicNames = {
      warna: 'Warna', haiwan: 'Haiwan', buah: 'Buah-buahan',
      nombor: 'Nombor', bentuk: 'Bentuk', abc: 'ABC'
    };
    document.getElementById('submenu-title').innerText = 'Jom Belajar ' + topicNames[topicKey];
    showView('submenu');
  }

  function startMode(mode) {
    currentMode = mode;
    showView('quiz');
    loadQuestion();
  }

  function loadQuestion() {
    const list = DATA[currentTopic];
    const container = document.getElementById('options-container');
    container.innerHTML = '';

    if (currentMode === 'quiz') {
      // Pilih 1 jawapan betul secara rawak
      const correctIndex = Math.floor(Math.random() * list.length);
      currentCorrectItem = list[correctIndex];

      document.getElementById('question-text').innerText = `Yang manakah ${currentCorrectItem.name}?`;
      speakText(`Yang manakah ${currentCorrectItem.name}?`);

      // Susun pilihan secara rawak
      const shuffled = [...list].sort(() => Math.random() - 0.5);

      shuffled.forEach(item => {
        const card = createCard(item);
        card.onclick = () => checkAnswer(item);
        container.appendChild(card);
      });
    } else {
      // Mode Belajar
      document.getElementById('question-text').innerText = 'Tekan untuk dengar!';
      list.forEach(item => {
        const card = createCard(item);
        card.onclick = () => {
          speakText(item.name);
        };
        container.appendChild(card);
      });
    }
  }

  function createCard(item) {
    const card = document.createElement('div');
    card.className = 'option-card';

    if (item.type === 'color') {
      const colorBox = document.createElement('div');
      colorBox.className = 'color-block';
      colorBox.style.backgroundColor = item.value;
      card.appendChild(colorBox);
    } else {
      card.innerText = item.value;
    }
    return card;
  }

  function checkAnswer(selectedItem) {
    if (selectedItem.name === currentCorrectItem.name) {
      stars += 1;
      document.getElementById('star-count').innerText = stars;
      speakText('Pandai!');
      setTimeout(() => {
        loadQuestion();
      }, 1000);
    } else {
      speakText('Cuba lagi!');
    }
  }

  function speakCurrentQuestion() {
    const text = document.getElementById('question-text').innerText;
    speakText(text);
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ms-MY';
      utterance.rate = 0.8; // Sebutan perlahan untuk kanak-kanak
      window.speechSynthesis.speak(utterance);
    }
  }
</script>
</body>
</html>
